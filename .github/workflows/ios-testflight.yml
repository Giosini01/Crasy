# .github/workflows/ios-testflight.yml
#
# CRASY su TestFlight da GitHub Actions.
#
# Porting fedele di codemagic.yaml: stessa logica, stessi strumenti
# (codemagic-cli-tools sono open source e si installano con pip), stessa
# gestione delle due chiavi. Cambia solo la macchina che esegue.
#
# Su repository PUBBLICO i runner macOS sono gratuiti e illimitati.
#
# ---------------------------------------------------------------------------
# Secret da creare in Settings > Secrets and variables > Actions > Secrets:
#
#   APP_STORE_CONNECT_KEY_IDENTIFIER    il Key ID (A5PPT67BHM)
#   APP_STORE_CONNECT_ISSUER_ID         l'Issuer ID, quello coi trattini
#   APP_STORE_CONNECT_PRIVATE_KEY_B64   il .p8 in base64, una riga sola
#   CERTIFICATE_PRIVATE_KEY_B64         la chiave del certificato di firma,
#                                       in base64. E' LA STESSA che sta su
#                                       Codemagic: se ne generi una nuova,
#                                       Apple emette un certificato nuovo, e
#                                       quelli di distribuzione sono contati.
#
# E in Settings > Secrets and variables > Actions > Variables (non secret):
#
#   APP_STORE_APP_ID                    facoltativa, e ormai non la legge
#                                       piu' nessuno: il numero di build lo
#                                       da' l'orologio. Resta perche' toglierla
#                                       da GitHub non serve a niente.
# ---------------------------------------------------------------------------

name: CRASY su TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'firestore.rules'
      - 'storage.rules'

# Su repo pubblico i secret non sono leggibili dalle pull request dei fork:
# questo workflow gira solo su push a main e su avvio manuale.

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  testflight:
    name: Build firmata e caricamento
    runs-on: macos-26
    timeout-minutes: 45          # come max_build_duration su Codemagic

    env:
      BUNDLE_ID: app.crasy.mobile
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter 3.44.9
        # Fissata, non "stable": una versione che cambia da sola sotto i piedi
        # produce il guaio peggiore che ci sia.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      - name: Strumenti Codemagic
        # Gli stessi `app-store-connect`, `keychain` e `xcode-project` che usa
        # Codemagic. Installati in un venv perche' il python di sistema del
        # runner rifiuta le installazioni dirette.
        run: |
          python3 -m venv "$RUNNER_TEMP/cmtools"
          "$RUNNER_TEMP/cmtools/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/cmtools/bin/pip" install --quiet codemagic-cli-tools
          echo "$RUNNER_TEMP/cmtools/bin" >> "$GITHUB_PATH"

      - name: Dipendenze
        run: flutter pub get

      - name: Analisi e prove
        # Prima di compilare, non dopo: trenta minuti di Mac per scoprire che
        # un test era rosso sono trenta minuti buttati.
        run: |
          flutter analyze lib test
          flutter test

      - name: Certificati
        # Le chiavi sono due e fanno due mestieri diversi: la .p8 e' il
        # lasciapassare per parlare con Apple, l'altra e' la chiave privata del
        # certificato di firma. Arrivano in base64 perche' un PEM incollato in
        # una casella di testo perde gli a capo e smette di essere una chiave.
        env:
          APP_STORE_CONNECT_PRIVATE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_B64 }}
          CERTIFICATE_PRIVATE_KEY_B64: ${{ secrets.CERTIFICATE_PRIVATE_KEY_B64 }}
        run: |
          set -e

          rimetti_in_riga() {
            VALORE="$1"; DESTINAZIONE="$2"; NOME="$3"

            if [ -z "$VALORE" ]; then
              echo "La variabile di $NOME e' vuota: controlla il nome del secret."
              exit 1
            fi

            case "$VALORE" in
              *BEGIN*) TESTO="$VALORE" ;;
              *) TESTO=$(printf '%s' "$VALORE" | tr -d ' \t\n\r' | openssl base64 -d -A) ;;
            esac

            APERTURA=$(printf '%s\n' "$TESTO" | grep -o -- '-----BEGIN [A-Z ]*-----' | head -1)
            CHIUSURA=$(printf '%s\n' "$TESTO" | grep -o -- '-----END [A-Z ]*-----' | head -1)

            if [ -z "$APERTURA" ]; then
              echo "Quello che c'e' nella variabile di $NOME non e' una chiave."
              exit 1
            fi

            CORPO=$(printf '%s\n' "$TESTO" \
              | sed -e 's/-----BEGIN [A-Z ]*-----//' -e 's/-----END [A-Z ]*-----//' \
              | tr -d ' \t\n\r')

            {
              echo "$APERTURA"
              printf '%s\n' "$CORPO" | fold -w 64
              echo "$CHIUSURA"
            } > "$DESTINAZIONE"
            chmod 600 "$DESTINAZIONE"

            if ! openssl pkey -in "$DESTINAZIONE" -noout 2>/dev/null; then
              echo "La chiave di $NOME si e' rotta per strada: rimettila in"
              echo "base64, tutta su una riga."
              exit 1
            fi

            echo "$NOME: a posto"
          }

          rimetti_in_riga "$APP_STORE_CONNECT_PRIVATE_KEY_B64" "$RUNNER_TEMP/authkey.p8" "App Store Connect"
          rimetti_in_riga "$CERTIFICATE_PRIVATE_KEY_B64" "$RUNNER_TEMP/certificato.pem" "certificato di firma"

          # Tutte le chiamate ad Apple vogliono le stesse tre credenziali.
          # Scritte una volta sola, cosi' non possono divergere fra loro.
          asc() {
            app-store-connect "$@" \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --private-key @file:"$RUNNER_TEMP/authkey.p8"
          }

          # **Le capacita' non basta dichiararle nell'app: vanno accese
          # sull'App ID.**
          #
          # `Runner.entitlements` promette notifiche push e associated domains.
          # Apple mantiene la promessa solo se l'identificativo dell'app le ha
          # abilitate nel portale e il profilo di provisioning le riporta
          # dentro. Se ne manca una, `xcodebuild archive` esce con 65 — un
          # codice che non nomina la causa, e il motivo vero resta in un log
          # che non arriva a schermo.
          #
          # Accendere una capacita' gia' accesa non fa niente: si puo'
          # rilanciare quante volte si vuole.
          ID_APP=$(asc bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --platform IOS \
            --json | python3 -c "import json,sys; v=json.load(sys.stdin); print(v[0]['id'] if v else '')")

          if [ -z "$ID_APP" ]; then
            echo "L'App ID non esiste ancora: lo creera' il passo qui sotto."
            echo "Le capacita' si accenderanno alla build successiva."
          else
            echo "App ID: $ID_APP"

            asc bundle-ids enable-capabilities "$ID_APP" \
              --capability "Push Notifications" "Associated Domains" \
              || echo "Capacita' gia' attive: nulla da fare."

            # Accendere una capacita' invalida i profili gia' emessi: non
            # portano dentro il permesso nuovo, e riusarli farebbe fallire
            # l'archivio esattamente come prima. Si cancellano solo quelli
            # marcati INVALID — a regime non ce ne sono e questo giro e' a
            # vuoto — e `--create` qui sotto ne emette uno aggiornato.
            for PROFILO in $(asc bundle-ids profiles "$ID_APP" \
              --type IOS_APP_STORE \
              --state INVALID \
              --json | python3 -c "import json,sys; [print(p['id']) for p in json.load(sys.stdin)]"); do
              echo "Profilo $PROFILO non piu' valido: lo rimuovo"
              asc profiles delete "$PROFILO" || true
            done
          fi

          # --create registra il bundle id se manca, emette il certificato se
          # non c'e', crea il profilo se non c'e'. Dalla seconda volta trova
          # tutto. La chiave API deve avere ruolo App Manager.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @file:"$RUNNER_TEMP/authkey.p8" \
            --certificate-key @file:"$RUNNER_TEMP/certificato.pem"

          # Il portachiavi nasce vuoto a ogni build.
          keychain initialize
          keychain add-certificates

      - name: Numero di build
        # **Il momento in cui e' stata fatta, non "l'ultimo piu' uno".**
        #
        # Prima si chiedeva ad Apple qual era l'ultimo numero e si aggiungeva
        # uno. Sembra la cosa giusta e ha un buco: Apple risponde con l'ultimo
        # **gia' elaborato**, e una build caricata pochi minuti prima sta
        # ancora in lavorazione. Due tentativi ravvicinati — cioe' la norma
        # quando si sta inseguendo un errore — chiedono lo stesso numero, e il
        # secondo si prende un 409 dopo aver compilato e firmato tutto: dieci
        # minuti di macchina buttati sull'ultimo passo.
        #
        # L'orologio quel problema non ce l'ha. Anno, giorno dell'anno, ora e
        # minuto: sale sempre, non si ripete, e si legge — 262641901 e' il
        # giorno 264 del 2026 alle 19:01. Sta sotto il limite di Apple e ci
        # resta per i prossimi settant'anni.
        #
        # L'unica collisione possibile e' fra due build dello stesso minuto, e
        # non e' un caso che valga la pena coprire.
        run: |
          NUMERO=$(date -u +%y%j%H%M)

          echo "Build numero $NUMERO"
          echo "NUMERO=$NUMERO" >> "$GITHUB_ENV"

      - name: Compila
        # Flutter compila ma non firma: `flutter build ipa` cerca un
        # certificato di sviluppo che qui non c'e' e non ci deve essere. Poi si
        # applicano i profili sul progetto com'e' rimasto dopo pod install, e
        # firma e impacchetta lo strumento di Codemagic.
        #
        # **I pagamenti si accendono qui.** Senza `CRASY_PAYMENTS` l'app nasce
        # con i soldi spenti: la missione parte gratis e Stripe non si apre
        # mai. Era acceso solo in codemagic.yaml, ma le build per TestFlight
        # le fa questo file.
        run: |
          flutter build ios --release --no-codesign --build-number=$NUMERO --dart-define=CRASY_PAYMENTS=true

          sed -i '' '/DEVELOPMENT_TEAM = /d' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          xcode-project use-profiles

          xcode-project build-ipa --project "ios/Runner.xcodeproj" --scheme "Runner"

      - name: Su TestFlight
        # Si carica e basta: niente --testflight. Mandare in revisione a ogni
        # build significa prendersi un 422 "Another build is in review" e
        # tingere di rosso una build andata benissimo. I tester interni non
        # passano da nessuna revisione.
        run: |
          app-store-connect publish \
            --path build/ios/ipa/*.ipa \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @file:"$RUNNER_TEMP/authkey.p8"

      - name: Artefatti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crasy-ios-${{ env.NUMERO }}
          path: |
            build/ios/ipa/*.ipa
            /tmp/xcodebuild_logs/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Pulizia chiavi
        if: always()
        run: rm -f "$RUNNER_TEMP/authkey.p8" "$RUNNER_TEMP/certificato.pem"
