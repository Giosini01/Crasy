# .github/workflows/android-app-distribution.yml
#
# CRASY per Android su Firebase App Distribution.
#
# Ogni push su `main` (o un avvio a mano: Actions > CRASY su Android > Run
# workflow) compila l'APK firmato e lo carica su App Distribution. Da li', nella
# console di Firebase, si scelgono i tester e parte l'email con il link.
#
# Secret che servono:
#
#   ANDROID_KEYSTORE_B64       la chiave di firma (.p12 o .jks), in base64
#   ANDROID_KEYSTORE_PASSWORD  la sua password
#   ANDROID_KEY_ALIAS          l'alias della chiave dentro il file
#   FIREBASE_SERVICE_ACCOUNT   la stessa chiave di servizio del sito e del server
#
# Variabile facoltativa:
#
#   ANDROID_TESTER_GROUPS      i gruppi di App Distribution a cui mandarla da
#                              sola (es. "tutti"). Vuota: si carica e basta, e
#                              i tester si scelgono dalla console.
#
# **Senza chiave non si carica niente.** Un APK firmato con la chiave di prova
# del server cambia firma a ogni build, e Android rifiuta di installarlo sopra
# quello di prima: chi l'ha gia' dovrebbe disinstallare ogni volta.

name: CRASY su Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'firestore.rules'
      - 'storage.rules'
      - 'functions/**'

concurrency:
  group: android-app-distribution
  cancel-in-progress: true

jobs:
  distribuisci:
    name: APK firmato su App Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # Quello di android/app/google-services.json (app.crasy.mobile), non
      # quello rimasto in lib/firebase_options.dart.
      FIREBASE_ANDROID_APP_ID: '1:781052311292:android:2a138cbaf926c84f264979'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.44.9
        # La stessa versione della build per iPhone: le due app devono essere
        # la stessa app.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Chiave di firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Mancano i secret della chiave Android (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS)."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/crasy-release.keystore"

          # `key.properties` lo legge android/app/build.gradle.kts.
          {
            echo "storeFile=$RUNNER_TEMP/crasy-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Numero di build
        # Mille piu' il numero della corsa: sale sempre, e parte sopra a
        # qualunque APK fatto a mano finora. Android installa un aggiornamento
        # solo se il numero e' piu' alto di quello che c'e'.
        run: |
          NUMERO=$(( 1000 + GITHUB_RUN_NUMBER ))
          echo "Build numero $NUMERO"
          echo "NUMERO=$NUMERO" >> "$GITHUB_ENV"

      - name: Compila
        # Un APK solo per tutti i telefoni: e' quello che si scarica da un
        # link, e non bisogna chiedere a nessuno che processore ha.
        run: |
          flutter build apk --release --build-number=$NUMERO --dart-define=CRASY_PAYMENTS=true

      - name: Firebase CLI
        run: npm install --global firebase-tools

      - name: Su App Distribution
        env:
          CHIAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GRUPPI: ${{ vars.ANDROID_TESTER_GROUPS }}
          MESSAGGIO: ${{ github.event.head_commit.message }}
        run: |
          set -e

          printf '%s' "$CHIAVE" > "$RUNNER_TEMP/chiave.json"
          chmod 600 "$RUNNER_TEMP/chiave.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/chiave.json"

          NOTE=$(printf '%s' "${MESSAGGIO:-Nuova versione di CRASY}" | head -n 1)
          EXTRA=()

          if [ -n "$GRUPPI" ]; then
            EXTRA+=(--groups "$GRUPPI")
          fi

          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --release-notes "$NOTE" \
            "${EXTRA[@]}"

      - name: Artefatti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crasy-android-${{ env.NUMERO }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Pulizia chiavi
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/crasy-release.keystore" "$RUNNER_TEMP/chiave.json"
