<!DOCTYPE html>
<html lang="it">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CRASY: challenge con foto e video e premi in denaro. DO SOMETHING CRAZY.">
  <meta name="theme-color" content="#FFFFFF">

  <!-- Su iPhone la pagina va a tutto schermo se aggiunta alla schermata home;
       la barra di stato resta chiara come il resto dell'app. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CRASY">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CRASY</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Evita il lampo scuro fra il caricamento della pagina e la prima frame
       di Flutter sui dispositivi in tema scuro. */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #FFFFFF;
      color-scheme: light;
    }

    /* Il browser mette un occhio suo sui campi password, e su Flutter non fa
       niente: il testo lo disegna la tela, non l'input nascosto sotto. Ne
       restavano due, e uno era finto. Qui si toglie quello del browser e resta
       il nostro, che funziona. */
    input::-ms-reveal,
    input::-ms-clear {
      display: none;
    }

    input::-webkit-credentials-auto-fill-button,
    input::-webkit-strong-password-auto-fill-button,
    input::-webkit-textfield-decoration-container {
      visibility: hidden;
      display: none !important;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Il service worker di Flutter resta acceso, e prima non lo era.
       Durante le prove sul tunnel veniva disiscritto a ogni caricamento: le
       build si susseguivano di continuo e la copia in cache serviva la versione
       di mezz'ora prima. Su un indirizzo stabile il conto si rovescia — e' cio'
       che rende CRASY installabile sul telefono e ne fa un'app che si apre
       subito invece di una pagina che si scarica ogni volta.

       Il prezzo e' che dopo un aggiornamento la prima apertura mostra ancora la
       versione precedente e la seconda quella nuova. E' il funzionamento
       normale di una app installata, non un difetto da correggere. -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // **L'app si aggiorna da sola.**
    //
    // Senza questo, dopo ogni pubblicazione la prima apertura mostra ancora la
    // versione precedente e solo la seconda quella nuova: e' il funzionamento
    // normale di una app installata, e va benissimo per un'app ferma. Per una
    // che cambia tutti i giorni e' il modo migliore di far dire "e' ancora
    // rotto" a chi sta guardando una correzione che c'e' gia'.
    //
    // Il momento giusto e' quando il nuovo service worker ha finito di
    // installarsi **e ce n'era gia' uno che controllava la pagina**: quel
    // secondo controllo distingue un aggiornamento da una prima installazione,
    // che non ha niente da ricaricare.
    //
    // Il flag e' l'unica difesa contro il ciclo infinito, e basta: dopo il
    // ricaricamento e' il nuovo service worker a controllare la pagina, quindi
    // non c'e' piu' niente da installare.
    (function () {
      if (!('serviceWorker' in navigator)) {
        return;
      }

      var reloading = false;

      navigator.serviceWorker.ready.then(function (registration) {
        registration.addEventListener('updatefound', function () {
          var incoming = registration.installing;

          if (!incoming) {
            return;
          }

          incoming.addEventListener('statechange', function () {
            var ready = incoming.state === 'installed' || incoming.state === 'activated';

            if (ready && navigator.serviceWorker.controller && !reloading) {
              reloading = true;
              window.location.reload();
            }
          });
        });
      });
    })();
  </script>
</body>
</html>
