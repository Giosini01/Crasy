<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- **Fuori dai motori di ricerca.** Non e' una protezione: quella sta sul server, in
     `functions/pannello.js` e `functions/admin.js`. Ma una pagina amministrativa
     indicizzata e' un invito a provarci scritto in prima pagina. -->
<meta name="robots" content="noindex, nofollow">
<title>CRASY — Pannello</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- L'accesso: le stesse credenziali dell'app. Non c'e' nessuna password di
     amministratore da nessuna parte: il permesso e' un attributo dell'account, non un
     segreto in piu' da custodire. -->
<section id="accesso" class="accesso" hidden>
  <img class="marchio" src="/brand/crasy-wordmark.png" alt="CRASY" width="138">
  <h1>Il pannello<span class="rosso">.</span></h1>
  <p class="occhiello-testo">Entra con l'account CRASY che ha il permesso di amministratore.</p>
  <form id="modulo">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="tasto tasto--nero tasto--largo" type="submit">Entra</button>
  </form>
  <p id="erroreAccesso" class="errore" hidden></p>
</section>

<div id="tavolo" class="tavolo" hidden>
  <nav class="fianco" aria-label="Sezioni">
    <a class="fianco__marchio" href="#/panoramica">
      <img src="/brand/crasy-wordmark.png" alt="CRASY" width="104">
    </a>
    <ul id="voci" class="voci"></ul>
    <div class="fianco__chi">
      <span id="chi" class="tenue"></span>
      <button id="esci" class="tasto tasto--piccolo">Esci</button>
    </div>
  </nav>
  <main id="contenuto" class="contenuto" tabindex="-1"></main>
</div>

<dialog id="domanda" class="domanda"></dialog>
<div id="messaggi" class="messaggi" role="status" aria-live="polite"></div>

<script type="module" src="/admin/js/app.js"></script>
</body>
</html>
