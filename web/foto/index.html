<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Una foto in gara su CRASY</title>
<meta name="description" content="Qualcuno ti ha mandato la sua foto in gara. Scarica CRASY per darle una fiamma.">
<meta property="og:title" content="Guarda la mia foto in gara su CRASY">
<meta property="og:description" content="Vince quella che prende piu' fiamme. Scarica CRASY e dammene una.">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.png">
<!--
  La pagina che si apre toccando un link condiviso da dentro CRASY.

  ## Perche' esiste

  Chi e' in gara manda la sua foto a dieci persone e chiede una fiamma: e' la
  porta d'ingresso dell'app, e per un po' e' rimasta chiusa. Da quando
  crasyapp.com serve la vetrina, quel link atterrava sulla pagina di
  presentazione e **la foto non si vedeva da nessuna parte**: chi la riceveva
  non sapeva nemmeno cosa gli fosse stato mandato.

  ## E perche' non apre l'app

  Perche' non deve. Il sito e' una vetrina, non una seconda CRASY che gira nel
  browser: qui si guarda la foto e si scarica l'app, e la fiamma si da' solo
  dentro l'app. E' la ragione per cui il tasto qui sotto porta agli store e non
  a una schermata di accesso.

  ## Come fa a mostrare la foto senza account

  Le foto in gara sono gia' pubbliche via indirizzo — lo dicono le regole dello
  spazio (`storage.rules`: `allow read: if true` sotto `entries/`), perche'
  altrimenti non si vedrebbero nemmeno dentro l'app. Il link porta con se' il
  **percorso** del file, non un indirizzo completo con dentro un gettone: e'
  piu' corto, e non regala niente che non fosse gia' pubblico.

  Niente database, nessuna funzione, nessun server: questa pagina e' un file
  fermo, e quello che mostra lo prende da un indirizzo che chiunque potrebbe
  comporre.
-->
<style>
  :root {
    --rosso: #FA0000;
    --nero: #0A0A0B;
    --grigio: #6B6B70;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #FFFFFF;
    color: var(--nero);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 22px 18px 34px;
  }

  .marchio {
    height: 26px;
    margin-bottom: 20px;
  }

  .cornice {
    width: 100%;
    max-width: 380px;
    aspect-ratio: 1;
    border: 3px solid var(--rosso);
    border-radius: 18px;
    overflow: hidden;
    background: #F4F4F5;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cornice img,
  .cornice video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Quando la foto non c'e' piu': finita la gara, i file dei perdenti si
     cancellano. Non e' un errore, ed e' meglio dirlo che lasciare un buco. */
  .assente {
    color: var(--grigio);
    font-size: 14px;
    text-align: center;
    padding: 26px;
    line-height: 1.5;
  }

  .titolo {
    font-size: 21px;
    font-weight: 800;
    text-align: center;
    margin: 20px 0 2px;
    max-width: 380px;
    text-transform: uppercase;
    line-height: 1.15;
  }

  .autore {
    color: var(--grigio);
    font-size: 14px;
    margin-bottom: 22px;
  }

  .richiesta {
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    max-width: 340px;
    line-height: 1.35;
    margin: 0 0 4px;
  }

  .richiesta b { color: var(--rosso); }

  .sotto {
    color: var(--grigio);
    font-size: 13px;
    text-align: center;
    margin: 0 0 20px;
  }

  .negozi {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .store {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 11px 16px;
    border-radius: 12px;
    background: var(--nero);
    color: #FFFFFF;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
  }

  .store--spento {
    background: #FFFFFF;
    color: var(--grigio);
    border: 1px solid #E8E8EA;
  }

  .store small {
    display: block;
    font-size: 10px;
    font-weight: 600;
    opacity: 0.7;
    letter-spacing: 0.4px;
  }

  .torna {
    margin-top: 26px;
    color: var(--grigio);
    font-size: 12px;
    text-decoration: none;
  }
</style>
</head>
<body>

<img class="marchio" src="/brand/crasy-wordmark.png" alt="CRASY">

<div class="cornice" id="cornice">
  <div class="assente" id="assente">Sto caricando la foto…</div>
</div>

<h1 class="titolo" id="titolo"></h1>
<div class="autore" id="autore"></div>

<p class="richiesta">La fiamma si dà <b>dentro CRASY</b>.</p>
<p class="sotto">Scarica l'app, cerca la missione e vota.</p>

<div class="negozi">
  <span class="store store--spento">
    <svg viewBox="0 0 384 512" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
    <span><small>PRESTO SU</small>App Store</span>
  </span>
  <span class="store store--spento">
    <svg viewBox="0 0 512 512" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M325.3 234.3 104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
    <span><small>PRESTO SU</small>Google Play</span>
  </span>
</div>

<a class="torna" href="/">Cos'è CRASY</a>

<script>
  // Il secchio dello spazio. Scritto qui e non chiesto a nessuno: questa pagina
  // non parla con Firebase, compone un indirizzo e lo mette dentro un tag.
  var SECCHIO = 'daily-dating-app.firebasestorage.app';

  var q = new URLSearchParams(location.search);
  var percorso = q.get('p') || '';
  var titolo = q.get('t') || '';
  var autore = q.get('a') || '';

  if (titolo) {
    document.getElementById('titolo').textContent = titolo;
  }

  if (autore) {
    document.getElementById('autore').textContent = '@' + autore;
  }

  var cornice = document.getElementById('cornice');
  var assente = document.getElementById('assente');

  function nonCePiu(messaggio) {
    assente.textContent = messaggio;
  }

  if (!percorso) {
    nonCePiu('Questo link non porta nessuna foto.');
  } else {
    var indirizzo =
      'https://firebasestorage.googleapis.com/v0/b/' +
      SECCHIO +
      '/o/' +
      encodeURIComponent(percorso) +
      '?alt=media';

    // I video si riconoscono dall'estensione del percorso, che e' l'unica cosa
    // che il link porta con se'.
    var eUnVideo = /\.(mp4|mov|m4v)$/i.test(percorso);
    var elemento = document.createElement(eUnVideo ? 'video' : 'img');

    elemento.src = indirizzo;

    if (eUnVideo) {
      elemento.controls = true;
      elemento.playsInline = true;
      elemento.muted = true;
      elemento.loop = true;
      elemento.autoplay = true;
    } else {
      elemento.alt = titolo || 'Una foto in gara su CRASY';
    }

    elemento.addEventListener('load', function () {
      assente.remove();
    });

    elemento.addEventListener('loadeddata', function () {
      assente.remove();
    });

    // **La foto puo' non esserci piu', ed e' normale.** Finita una gara, i file
    // di chi non ha vinto si cancellano: un link vecchio non e' rotto, e' solo
    // arrivato tardi.
    elemento.addEventListener('error', function () {
      elemento.remove();
      nonCePiu('Questa foto non c’è più: la gara è finita e le foto di chi non ha vinto si cancellano.');
    });

    cornice.appendChild(elemento);
  }
</script>

</body>
</html>
