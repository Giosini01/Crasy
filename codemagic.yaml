# CRASY su TestFlight, senza toccare un Mac.
#
# Ogni push su `main` diventa una build firmata che finisce in TestFlight, e da
# li' una notifica sul telefono di chi la sta provando. Il Mac serve solo se si
# vuole il hot reload mentre si sviluppa.
#
# Serve una volta sola, dalla parte di Codemagic:
#
#   1. accesso con GitHub e collegamento del repository;
#   2. una **chiave API di App Store Connect** (Users and Access ->
#      Integrations -> App Store Connect API): il file .p8, il Key ID e
#      l'Issuer ID. Su Codemagic **non** si mettono come integrazione ma come
#      gruppo di variabili chiamato `appstore`, e la chiave privata **in
#      base64**: incollata cosi' com'e' perde gli a capo e smette di essere una
#      chiave;
#   3. su App Store Connect, la scheda dell'app: Apps -> +, bundle id
#      `app.crasy.mobile`. Senza quella il caricamento non ha dove atterrare.
#
# La firma **non si configura**: con la chiave API, Codemagic crea e rinnova da
# solo certificati e profili. E' il pezzo che a mano fa perdere i pomeriggi.

workflows:
  ios-testflight:
    name: CRASY su TestFlight
    instance_type: mac_mini_m2
    # Tre quarti d'ora e' il doppio abbondante di quanto serve: e' un freno
    # contro una build che si impianta e mangia i minuti del mese.
    max_build_duration: 45

    environment:
      # Fissata, non "stable". Una versione che cambia da sola sotto i piedi
      # produce il guaio peggiore che ci sia: funziona sul mio computer e si
      # rompe qui, senza che nessuno abbia toccato niente. Si alza a mano,
      # quando si e' pronti ad alzarla.
      flutter: 3.44.9
      xcode: latest
      cocoapods: default

      vars:
        BUNDLE_ID: app.crasy.mobile

      groups:
        # **Le credenziali passano da qui, non da un'integrazione con un nome.**
        #
        # La strada "pulita" — `integrations: app_store_connect: appstore` —
        # e' morta con "integration does not exist" pur essendoci: quella voce
        # cerca una cosa che nell'interfaccia sta sotto un altro nome, e
        # indovinare quale non e' un lavoro.
        #
        # Cosi' invece non c'e' niente da indovinare: tre variabili con i nomi
        # che gli strumenti di Codemagic leggono da soli. Il gruppo va creato
        # in Codemagic con **questo nome esatto**, e dentro:
        #
        #   APP_STORE_CONNECT_KEY_IDENTIFIER   il Key ID (A5PPT67BHM)
        #   APP_STORE_CONNECT_ISSUER_ID        l'Issuer ID, quello coi trattini
        #   APP_STORE_CONNECT_PRIVATE_KEY_B64  il file .p8 in base64, una riga
        #                                      sola, **segnato come secure**
        #   CERTIFICATE_PRIVATE_KEY_B64        la chiave del certificato di
        #                                      firma, sempre in base64 e sempre
        #                                      secure. Si genera una volta con
        #                                      `openssl genrsa 2048` e **non si
        #                                      cambia piu'**: cambiarla vuol dire
        #                                      un certificato nuovo ogni volta,
        #                                      e Apple ne concede pochi.
        - appstore

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      # Una modifica al README non merita quindici minuti di Mac.
      cancel_previous_builds: true

    scripts:
      - name: Dipendenze
        script: flutter pub get

      - name: Analisi e prove
        # **Prima di compilare, non dopo.** Dodici minuti di build per scoprire
        # che un test era rosso sono dodici minuti buttati, e una versione
        # rotta che arriva ai tester e' peggio di una versione che non arriva.
        script: |
          flutter analyze
          flutter test

      - name: Numero di build
        # Il numero deve salire a ogni caricamento, e App Store Connect rifiuta
        # senza spiegarsi. Si chiede a lui qual e' l'ultimo e si aggiunge uno:
        # cosi' il conto regge anche se una build e' partita dal Mac.
        #
        # Al primo giro l'app su App Store Connect non ha ancora nessuna build
        # — e `APP_STORE_APP_ID` non e' nemmeno impostata, perche' quel numero
        # Apple lo assegna dopo. Si ripiega sul contatore di Codemagic, che
        # parte da uno e sale sempre. Quando l'app avra' un numero, basta
        # aggiungerlo fra le variabili e il conto passa a chiederlo ad Apple.
        script: |
          ULTIMO=$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_APP_ID" 2>/dev/null || echo "")

          if [ -z "$ULTIMO" ]; then
            NUMERO=$PROJECT_BUILD_NUMBER
          else
            NUMERO=$(($ULTIMO + 1))
          fi

          echo "Build numero $NUMERO"
          echo "NUMERO=$NUMERO" >> $CM_ENV

      - name: Certificati
        # **Le chiavi sono due, e fanno due mestieri diversi.**
        #
        # La `.p8` di App Store Connect e' il *lasciapassare*: serve a parlare
        # con Apple. La seconda e' la chiave privata del **certificato di
        # firma**: nasce su un computer, Apple ne firma solo la parte pubblica e
        # restituisce il certificato. Sul Mac di casa la crea Xcode di nascosto,
        # ed e' per questo che nessuno sa di averla. Qui la macchina viene
        # cancellata a fine build, quindi non c'e' nessuno che la crei: va
        # portata da fuori, sempre la stessa. Se cambiasse a ogni build, Apple si
        # ritroverebbe a emettere un certificato nuovo ogni volta, e i
        # certificati di distribuzione sono contati.
        #
        # **Le chiavi arrivano come una riga sola.** Una chiave PEM incollata in
        # una casella di testo perde gli a capo, e senza quelli non e' piu' una
        # chiave: e' il motivo di "Provided value is not a valid PEM encoded
        # private key". In base64 e' una riga e non si puo' rompere. Qui sotto si
        # accettano tutt'e due le forme e si rimette a posto, cosi' un incollaggio
        # sfortunato non costa un'altra build.
        script: |
          set -e

          rimetti_in_riga() {
            VALORE="$1"
            DESTINAZIONE="$2"
            NOME="$3"

            if [ -z "$VALORE" ]; then
              echo "La variabile di $NOME e' vuota: controlla che il gruppo"
              echo "'appstore' sia collegato e la variabile scritta giusta."
              exit 1
            fi

            # Gia' una chiave, o base64 da decodificare?
            case "$VALORE" in
              *BEGIN*) TESTO="$VALORE" ;;
              *) TESTO=$(printf '%s' "$VALORE" | tr -d ' \t\n\r' | openssl base64 -d -A) ;;
            esac

            APERTURA=$(printf '%s\n' "$TESTO" | grep -o -- '-----BEGIN [A-Z ]*-----' | head -1)
            CHIUSURA=$(printf '%s\n' "$TESTO" | grep -o -- '-----END [A-Z ]*-----' | head -1)

            if [ -z "$APERTURA" ]; then
              echo "Quello che c'e' nella variabile di $NOME non e' una chiave."
              exit 1
            fi

            # Il corpo torna su righe da 64 caratteri, come vuole il formato.
            CORPO=$(printf '%s\n' "$TESTO" \
              | sed -e 's/-----BEGIN [A-Z ]*-----//' -e 's/-----END [A-Z ]*-----//' \
              | tr -d ' \t\n\r')

            {
              echo "$APERTURA"
              printf '%s\n' "$CORPO" | fold -w 64
              echo "$CHIUSURA"
            } > "$DESTINAZIONE"
            chmod 600 "$DESTINAZIONE"

            # Il controllo vero: openssl la legge o no. Meglio saperlo adesso
            # che dentro il messaggio d'errore di un altro strumento.
            if ! openssl pkey -in "$DESTINAZIONE" -noout 2>/dev/null; then
              echo "La chiave di $NOME si e' rotta per strada: rimettila nella"
              echo "variabile in base64, tutta su una riga."
              exit 1
            fi

            echo "$NOME: a posto ($(wc -l < "$DESTINAZIONE" | tr -d ' ') righe)"
          }

          rimetti_in_riga "$APP_STORE_CONNECT_PRIVATE_KEY_B64" /tmp/authkey.p8 "App Store Connect"
          rimetti_in_riga "$CERTIFICATE_PRIVATE_KEY_B64" /tmp/certificato.pem "certificato di firma"

          # `--create` fa il lavoro vero: se il bundle id non e' registrato lo
          # registra, se il certificato non c'e' lo emette, se il profilo non
          # c'e' lo crea. Dalla seconda volta trova tutto e non crea niente —
          # ma solo perche' la chiave del certificato e' rimasta la stessa.
          # **La chiave API deve avere il ruolo App Manager**: con "Developer"
          # legge e non crea.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @file:/tmp/authkey.p8 \
            --certificate-key @file:/tmp/certificato.pem

          # Il portachiavi della macchina nasce vuoto a ogni build: i
          # certificati appena scaricati vanno messi dentro o Xcode non li vede.
          keychain initialize
          keychain add-certificates

      - name: Compila
        # **Flutter compila, ma non firma.**
        #
        # `flutter build ipa` prima di partire cerca un certificato di
        # *sviluppo* nel portachiavi, e qui non c'e' ne' ci deve essere: su
        # questa macchina c'e' quello di **distribuzione**, l'unico giusto per
        # TestFlight. Il controllo di Flutter non lo sa e si ferma con "No
        # development certificates available", che e' vero e irrilevante.
        #
        # Quindi: Flutter costruisce senza firmare, poi si applicano i profili
        # sul progetto **cosi' com'e' rimasto dopo `pod install`**, e infine
        # firma e impacchetta lo strumento di Codemagic.
        script: |
          flutter build ios --release --no-codesign --build-number=$NUMERO

          sed -i '' '/DEVELOPMENT_TEAM = /d' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          xcode-project use-profiles

          xcode-project build-ipa --project "ios/Runner.xcodeproj" --scheme "Runner"

      - name: Su TestFlight
        # Il caricamento usa **la stessa chiave rimessa a posto** del passo dei
        # certificati, non la variabile: cosi' c'e' un solo modo di leggerla, e
        # non due che possono divergere.
        script: |
          app-store-connect publish --path build/ios/ipa/*.ipa --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" --private-key @file:/tmp/authkey.p8 --testflight

    artifacts:
      - build/ios/ipa/*.ipa
      # I registri servono solo quando qualcosa va storto, ed e' esattamente
      # quando non si ha voglia di andarseli a cercare altrove.
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    # Niente blocco `publishing`: il caricamento lo fa il passo "Su TestFlight"
    # qui sopra, con la stessa chiave rimessa a posto una volta sola.
