# CRASY su TestFlight, senza toccare un Mac.
#
# Ogni push su `main` diventa una build firmata che finisce in TestFlight, e da
# li' una notifica sul telefono di chi la sta provando. Il Mac serve solo se si
# vuole il hot reload mentre si sviluppa.
#
# Serve una volta sola, dalla parte di Codemagic:
#
#   1. accesso con GitHub e collegamento del repository;
#   2. una **chiave API di App Store Connect** (Users and Access ->
#      Integrations -> App Store Connect API): il file .p8, il Key ID e
#      l'Issuer ID. Su Codemagic **non** si mettono come integrazione ma come
#      gruppo di variabili chiamato `appstore` — vedi il commento piu' sotto:
#      la strada dell'integrazione e' morta con "integration does not exist"
#      pur essendoci, e su una cosa che deve funzionare non si indovina;
#   3. su App Store Connect, la scheda dell'app: Apps -> +, bundle id
#      `app.crasy.mobile`. Senza quella il caricamento non ha dove atterrare.
#
# La firma **non si configura**: con la chiave API, Codemagic crea e rinnova da
# solo certificati e profili. E' il pezzo che a mano fa perdere i pomeriggi.

workflows:
  ios-testflight:
    name: CRASY su TestFlight
    instance_type: mac_mini_m2
    # Tre quarti d'ora e' il doppio abbondante di quanto serve: e' un freno
    # contro una build che si impianta e mangia i minuti del mese.
    max_build_duration: 45

    environment:
      # Fissata, non "stable". Una versione che cambia da sola sotto i piedi
      # produce il guaio peggiore che ci sia: funziona sul mio computer e si
      # rompe qui, senza che nessuno abbia toccato niente. Si alza a mano,
      # quando si e' pronti ad alzarla.
      flutter: 3.44.9
      xcode: latest
      cocoapods: default

      vars:
        BUNDLE_ID: app.crasy.mobile

      groups:
        # **Le credenziali passano da qui, non da un'integrazione con un nome.**
        #
        # La strada "pulita" — `integrations: app_store_connect: appstore` —
        # e' morta con "integration does not exist" pur essendoci: quella voce
        # cerca una cosa che nell'interfaccia sta sotto un altro nome, e
        # indovinare quale non e' un lavoro.
        #
        # Cosi' invece non c'e' niente da indovinare: tre variabili con i nomi
        # che gli strumenti di Codemagic leggono da soli. Il gruppo va creato
        # in Codemagic con **questo nome esatto**, e dentro:
        #
        #   APP_STORE_CONNECT_KEY_IDENTIFIER   il Key ID (A5PPT67BHM)
        #   APP_STORE_CONNECT_ISSUER_ID        l'Issuer ID, quello coi trattini
        #   APP_STORE_CONNECT_PRIVATE_KEY      il contenuto del file .p8,
        #                                      **segnato come secure**
        - appstore

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      # Una modifica al README non merita quindici minuti di Mac.
      cancel_previous_builds: true

    scripts:
      - name: Dipendenze
        script: flutter pub get

      - name: Analisi e prove
        # **Prima di compilare, non dopo.** Dodici minuti di build per scoprire
        # che un test era rosso sono dodici minuti buttati, e una versione
        # rotta che arriva ai tester e' peggio di una versione che non arriva.
        script: |
          flutter analyze
          flutter test

      - name: Numero di build
        # Il numero deve salire a ogni caricamento, e App Store Connect rifiuta
        # senza spiegarsi. Si chiede a lui qual e' l'ultimo e si aggiunge uno:
        # cosi' il conto regge anche se una build e' partita dal Mac.
        #
        # Al primo giro l'app su App Store Connect non ha ancora nessuna build
        # — e `APP_STORE_APP_ID` non e' nemmeno impostata, perche' quel numero
        # Apple lo assegna dopo. Si ripiega sul contatore di Codemagic, che
        # parte da uno e sale sempre. Quando l'app avra' un numero, basta
        # aggiungerlo fra le variabili e il conto passa a chiederlo ad Apple.
        script: |
          ULTIMO=$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_APP_ID" 2>/dev/null || echo "")

          if [ -z "$ULTIMO" ]; then
            NUMERO=$PROJECT_BUILD_NUMBER
          else
            NUMERO=$(($ULTIMO + 1))
          fi

          echo "Build numero $NUMERO"
          echo "NUMERO=$NUMERO" >> $CM_ENV

      - name: Firma
        # **I profili si creano, non si cercano soltanto.**
        #
        # La prima build e' morta qui con "No matching profiles found for
        # bundle identifier app.crasy.mobile": e' vero, non ce n'erano — quel
        # nome non era mai stato registrato nel portale Apple sotto il team a
        # pagamento. La firma dichiarativa di Codemagic i profili li cerca e
        # basta, e si ferma prima ancora di arrivare a questi passi.
        #
        # `--create` cambia la domanda: se il bundle id non c'e' lo registra, se
        # il certificato di distribuzione non c'e' lo emette, se il profilo non
        # c'e' lo fa. Dalla seconda volta in poi non crea niente perche' trova
        # tutto, e questa riga diventa invisibile.
        #
        # **La chiave API deve avere il ruolo App Manager**: con "Developer" ha
        # il permesso di leggere ma non di creare, e l'errore che ne esce parla
        # di autorizzazioni.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create

          # Il portachiavi della macchina che compila: nasce vuoto a ogni
          # build, e i certificati appena scaricati vanno messi dentro o
          # Xcode non li vede.
          keychain initialize
          keychain add-certificates

          # **Via la firma automatica, qui non puo' funzionare.**
          #
          # Nel progetto c'e' `DEVELOPMENT_TEAM`, che serve sul Mac di casa: con
          # quello Xcode firma da solo e non chiede niente. Ma Flutter, appena
          # lo vede, sceglie **la firma automatica** — e quella pretende un
          # account Apple collegato dentro Xcode. Su una macchina in affitto non
          # c'e' nessun account, e la build muore con "No Accounts: Add a new
          # account in Accounts settings", ignorando i profili appena scaricati.
          #
          # Qui si tolgono le due righe e si passa alla firma manuale, che e'
          # quella giusta per una macchina: i profili ce li ha gia' in mano.
          # Il progetto sul disco della macchina viene buttato a fine build,
          # quindi sul repository non cambia niente e sul Mac resta tutto com'e'.
          sed -i '' '/DEVELOPMENT_TEAM = /d' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj

          xcode-project use-profiles

      - name: Compila
        # **Flutter compila, ma non firma.**
        #
        # `flutter build ipa` prima di partire cerca un certificato di
        # *sviluppo* nel portachiavi, e qui non c'e' ne' ci deve essere: su
        # questa macchina c'e' un certificato di **distribuzione**, che e' quello
        # giusto per TestFlight. Il controllo di Flutter non lo sa e si ferma con
        # "No development certificates available", che e' vero e irrilevante.
        #
        # Allora si spezza in due: Flutter costruisce l'app senza firmarla, e a
        # firmare e a impacchettare ci pensa lo strumento di Codemagic, che i
        # profili li ha appena scaricati e sa quale usare.
        script: |
          flutter build ios --release --no-codesign --build-number=$NUMERO
          xcode-project build-ipa --project "ios/Runner.xcodeproj" --scheme "Runner"

    artifacts:
      - build/ios/ipa/*.ipa
      # I registri servono solo quando qualcosa va storto, ed e' esattamente
      # quando non si ha voglia di andarseli a cercare altrove.
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        # Le stesse tre variabili del gruppo qui sopra: chi carica e chi firma
        # usano la stessa chiave, e sono scritte una volta sola.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # In TestFlight si, sullo Store no: quella e' una decisione da prendere
        # a mano, non la conseguenza di un push.
        submit_to_testflight: true
        submit_to_app_store: false

      # email:
      #   recipients:
      #     - il-tuo-indirizzo@esempio.it
      #   notify:
      #     success: false
      #     failure: true
