name: crasy
description: "CRASY — challenge con foto e video e premi in denaro. DO SOMETHING CRAZY."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Per spezzare una frase in **lettere vere** invece che in unita' di codice:
  # una emoji o una lettera accentata composta valgono due unita', e tagliarle a
  # meta' produce due caratteri rotti. Serve alla didascalia curva, che le
  # disegna una per una.
  characters: ^1.4.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.1.0
  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  geolocator: ^14.0.3
  web: ^1.1.1
  image_picker: ^1.2.3
  video_player: ^2.9.2
  flutter_localizations:
    sdk: flutter
  cloud_functions: ^6.3.6
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  image: ^4.9.2
  camera: ^0.12.0+2
  firebase_messaging: ^16.6.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Il logotipo vero, gia' ritagliato sul segno e con il fondo trasparente.
    # Il file d'origine ha attorno un margine bianco enorme: messo cosi' com'e'
    # avrebbe occupato tre volte lo spazio che si vede.
    - assets/brand/crasy-wordmark.png
    # Lo stesso segno per i fondi scuri: le lettere bianche, le fiamme rosse.
    # E' il file vero ricolorato, non una scritta rifatta con un carattere.
    - assets/brand/crasy-wordmark-dark.png
