name: app_incontri
description: "Daily dating app foundation."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.1.0
  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  geolocator: ^14.0.3
  web: ^1.1.1
  image_picker: ^1.2.3
  flutter_localizations:
    sdk: flutter
  image: ^4.8.0
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Il logotipo vero, gia' ritagliato dal file d'origine: quello negli
    # assets ha attorno un margine trasparente enorme, e messo cosi' com'e'
    # avrebbe occupato tre volte lo spazio che si vede.
    - assets/brand/rawsy.png
    - assets/brand/rawsy-light.png
