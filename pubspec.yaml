name: crasy
description: "CRASY — challenge con foto e video e premi in denaro. DO SOMETHING CRAZY."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.1.0
  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  geolocator: ^14.0.3
  web: ^1.1.1
  image_picker: ^1.2.3
  video_player: ^2.9.2
  flutter_localizations:
    sdk: flutter
  cloud_functions: ^6.3.6
  url_launcher: ^6.3.2
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Il logotipo vero, gia' ritagliato sul segno e con il fondo trasparente.
    # Il file d'origine ha attorno un margine bianco enorme: messo cosi' com'e'
    # avrebbe occupato tre volte lo spazio che si vede.
    - assets/brand/crasy-wordmark.png
